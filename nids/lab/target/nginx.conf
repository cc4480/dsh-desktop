worker_processes 1;
events { worker_connections 4096; }
http {
    access_log off;
    server {
        listen 80;
        location = /             { return 200 "web-lab-01\n"; }
        location = /index.html   { return 200 "web-lab-01\n"; }
        location /api/           { return 200 "{}\n"; }
        location /static/        { return 200 "\n"; }
        location /img/           { return 200 "\n"; }
        location = /server-status { return 403; }
        location /               { return 404; }   # what a wordlist scan mostly gets
    }
    server {                                       # the "C2" endpoint the implant beacons to
        listen 443 ssl;
        ssl_certificate     /etc/ssl/certs/lab.crt;
        ssl_certificate_key /etc/ssl/private/lab.key;
        location / { return 204; }
    }
}
